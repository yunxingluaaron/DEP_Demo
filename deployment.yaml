apiVersion: apps/v1
kind: Deployment
metadata:
  name: ab-predictor-backend
  labels:
    app: ab-predictor
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ab-predictor
      component: backend
  template:
    metadata:
      labels:
        app: ab-predictor
        component: backend
    spec:
      containers:
      - name: ab-predictor-backend
        image: gcr.io/pittvine-dep/ab-predictor-backend:latest
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: PORT
          value: "5000"
        - name: MODEL_PATH
          value: "/app/model/ab_agent_model_2.pth"
        - name: FLASK_ENV
          value: "production"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ab-predictor-frontend
  labels:
    app: ab-predictor
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ab-predictor
      component: frontend
  template:
    metadata:
      labels:
        app: ab-predictor
        component: frontend
    spec:
      containers:
      - name: ab-predictor-frontend
        image: gcr.io/pittvine-dep/ab-predictor-frontend:latest
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
